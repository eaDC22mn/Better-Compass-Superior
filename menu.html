<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Better Compass Superior</title>
    <style>
        html {
            background: linear-gradient(100deg, #131313, #2d2d2d);
            border: 1px solid #5f6b70;
            border-radius: 12px;
            overflow: hidden;
        }
        body {
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
            color: #aae3ea;
            background: transparent;
            width: 280px;
            border: 0;
            border-radius: 12px;
            max-height: 580px;
            overflow-y: auto;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 18px;
        }
        .row {
            margin-bottom: 14px;
        }
        .icon-colour-picker-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 7px;
        }
        .icon-colour-picker-row > label {
            flex: 1;
            min-width: 0;
            gap: 5px;
            font-size: 10px;
            line-height: 1.2;
            white-space: nowrap;
        }
        .icon-colour-picker-row .switch {
            width: 30px;
            height: 18px;
        }
        .icon-colour-picker-row .switch .slider {
            width: 30px;
            height: 18px;
        }
        .icon-colour-picker-row .switch .slider::before {
            width: 12px;
            height: 12px;
            left: 3px;
            top: 3px;
        }
        .icon-colour-picker-row .switch input:checked + .slider::before {
            transform: translateX(12px);
        }
        .icon-colour-picker-row .color-row {
            flex: 0 0 auto;
            gap: 4px;
            margin: 0;
        }
        .icon-colour-picker-row input[type="color"] {
            width: 28px;
            height: 22px;
        }
        .icon-colour-picker-row .color-row span {
            margin-left: 0;
            font-size: 10px;
        }
        .icon-colour-picker-row .rainbow-row {
            flex: 1 0 100%;
            margin: 0 0 0 35px;
        }
        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .switch {
            position: relative;
            display: inline-flex;
            align-items: center;
            width: 42px;
            height: 24px;
            flex-shrink: 0;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }
        .switch .slider {
            position: absolute;
            inset: 0;
            cursor: pointer;
            border-radius: 999px;
            background: linear-gradient(135deg, #100606, #7c0707);
            transition: 0.2s ease;
            width: 42px;
            height: 24px;
            margin: 0;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
        }
        .switch .slider::before {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            top: 3px;
            border-radius: 50%;
            background: #fdfdfd;
            transition: 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        }
        .switch input:checked + .slider {
            background: linear-gradient(135deg, #0c311c, #23cb66);
        }
        .switch input:checked + .slider::before {
            transform: translateX(18px);
        }
        .help {
            font-size: 12px;
            color: #b3b3b3;
            margin-top: -8px;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        button {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #336222, #03240a);
            color: #ffffff;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: linear-gradient(135deg, #265a14, #014b11);
        }
        .slider {
            width: 100%;
            margin-top: 8px;
        }
        .color-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .color-row input[type="color"] {
            width: 42px;
            height: 28px;
            border: none;
            padding: 0;
            background: transparent;
        }
        .rainbow-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            margin-left: 50px;
        }
        .rainbow-switch {
            height: 18px;
        }
        .rainbow-switch .slider {
            height: 18px;
            background: linear-gradient(90deg, #ef4444, #f59e0b, #eab308, #22c55e, #06b6d4, #3b82f6, #a855f7, #ef4444);
            background-size: 200% 100%;
            animation: rainbow-slide 5s linear infinite;
        }
        .rainbow-switch .slider::before {
            width: 12px;
            height: 12px;
            top: 3px;
        }
        .rainbow-switch input:checked + .slider::before {
            transform: translateX(24px);
        }
        @keyframes rainbow-slide {
            from { background-position: 0 0; }
            to { background-position: 200% 0; }
        }
        #textColourValue,
        #navbarColourValue,
        #lessonPlanColumnColourValue,
        #tabBarColourValue,
        #classLabelColourValue,
        #timetableBackgroundColourValue,
        #messageIconColourValue,
        #blurValue,
        #zoomValue {
            margin-left: 6px;
            color: #b3b3b3;
            font-size: 12px;
        }
        #status {
            font-size: 13px;
            color: #b3b3b3;
            margin-top: 4px;
        }
        .subject-rule-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .subject-rule-row input[type="text"] {
            flex: 1 1 100%;
            min-width: 110px;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: linear-gradient(135deg, #112460, #040f25);
            color: rgb(250, 251, 251);
        }
        .subject-rule-row input[type="color"] {
            width: 40px;
            height: 32px;
            border: none;
            padding: 0;
            background: transparent;
        }
        .subject-rule-row button {
            flex: 0 0 auto;
            padding: 8px 10px;
            font-size: 12px;
            background: linear-gradient(135deg, #1e0a0a, #570707);
            color: white;
        }
        .subject-rules-section h2 {
            margin: 0 8 10px;
            font-size: 18px;
            color: #b3b3b3;
        }
    </style>
</head>
<body>
    <h1>Better Compass Superior</h1>
    <div class="row">
        <label>
            <span class="switch">
                <input id="editorModeToggle" type="checkbox" />
                <span class="slider"></span>
            </span>
            Enable/disable timetable editor mode
        </label>
        <div id="status">Loading…</div>
    </div>
    <div class="help">
        You can toggle the timetable colour editor here
    </div>
    <div class="row">
        <label>
            <span class="switch">
                <input id="textColourToggle" type="checkbox" />
                <span class="slider"></span>
            </span>
            Custom text colour
        </label>
        <div class="color-row">
            <input id="textColourPicker" type="color" value="#000000" />
            <span id="textColourValue">#000000</span>
        </div>
    </div>
    <div class="row">
        <label>
            <span class="switch">
                <input id="lessonPlanColumnColourToggle" type="checkbox" />
                <span class="slider"></span>
            </span>
            Resources table colour
        </label>
        <div class="color-row">
            <input id="lessonPlanColumnColourPicker" type="color" value="#e8f2ff" />
            <span id="lessonPlanColumnColourValue">#e8f2ff</span>
        </div>
    </div>
    <div class="row">
        <label>
            <span class="switch">
                <input id="tabBarColourToggle" type="checkbox" />
                <span class="slider"></span>
            </span>
            Lesson tabs colour
        </label>
        <div class="color-row">
            <input id="tabBarColourPicker" type="color" value="#e8f2ff" />
            <span id="tabBarColourValue">#e8f2ff</span>
        </div>
    </div>
    <div class="row">
        <label>
            <span class="switch">
                <input id="classLabelColourToggle" type="checkbox" />
                <span class="slider"></span>
            </span>
            Class label colour
        </label>
        <div class="color-row">
            <input id="classLabelColourPicker" type="color" value="#e8f2ff" />
            <span id="classLabelColourValue">#e8f2ff</span>
        </div>
    </div>
    <div class="row">
        <label>
            <span class="switch">
                <input id="timetableBackgroundColourToggle" type="checkbox" />
                <span class="slider"></span>
            </span>
            Timetable background colour
        </label>
        <div class="color-row">
            <input id="timetableBackgroundColourPicker" type="color" value="#e8f2ff" />
            <span id="timetableBackgroundColourValue">#e8f2ff</span>
        </div>
    </div>
    <div class="row">
        <label>
            <span class="switch">
                <input id="navbarColourToggle" type="checkbox" />
                <span class="slider"></span>
            </span>
            Custom navigation bar colour
        </label>
        <div class="color-row">
            <input id="navbarColourPicker" type="color" value="#000000" />
            <span id="navbarColourValue">#000000</span>
        </div>
        <label class="rainbow-row">
            <span class="switch rainbow-switch">
                <input id="rainbowNavbarToggle" type="checkbox" />
                <span class="slider"></span>
            </span>
            <span>Rainbow navigation bar</span>
        </label>
    </div>
    <div class="row icon-colour-picker-row">
        <label>
            <span class="switch"><input id="homeIconColourToggle" type="checkbox" /><span class="slider"></span></span>
            Home icon colour
        </label>
        <div class="color-row"><input id="homeIconColourPicker" type="color" value="#000000" /><span id="homeIconColourValue">#000000</span></div>
    </div>
    <div class="row icon-colour-picker-row">
        <label>
            <span class="switch"><input id="calendarIconColourToggle" type="checkbox" /><span class="slider"></span></span>
            Calendar icon colour
        </label>
        <div class="color-row"><input id="calendarIconColourPicker" type="color" value="#000000" /><span id="calendarIconColourValue">#000000</span></div>
    </div>
    <div class="row icon-colour-picker-row">
        <label>
            <span class="switch"><input id="messageIconColourToggle" type="checkbox" /><span class="slider"></span></span>
            Message icon colour
        </label>
        <div class="color-row"><input id="messageIconColourPicker" type="color" value="#000000" /><span id="messageIconColourValue">#000000</span></div>
    </div>
    <div class="row icon-colour-picker-row">
        <label>
            <span class="switch"><input id="editIconColourToggle" type="checkbox" /><span class="slider"></span></span>
            Edit icon colour
        </label>
        <div class="color-row"><input id="editIconColourPicker" type="color" value="#000000" /><span id="editIconColourValue">#000000</span></div>
    </div>
    <div class="row icon-colour-picker-row">
        <label>
            <span class="switch"><input id="gridIconColourToggle" type="checkbox" /><span class="slider"></span></span>
            Grid icon colour
        </label>
        <div class="color-row"><input id="gridIconColourPicker" type="color" value="#000000" /><span id="gridIconColourValue">#000000</span></div>
    </div>
    <div class="row icon-colour-picker-row">
        <label>
            <span class="switch"><input id="peopleIconColourToggle" type="checkbox" /><span class="slider"></span></span>
            People icon colour
        </label>
        <div class="color-row"><input id="peopleIconColourPicker" type="color" value="#000000" /><span id="peopleIconColourValue">#000000</span></div>
    </div>
    <div class="row icon-colour-picker-row">
        <label>
            <span class="switch"><input id="starIconColourToggle" type="checkbox" /><span class="slider"></span></span>
            Star icon colour
        </label>
        <div class="color-row"><input id="starIconColourPicker" type="color" value="#000000" /><span id="starIconColourValue">#000000</span></div>
    </div>
    <div class="row">
        <label for="backgroundBlur">
            Background image blur: <span id="blurValue">0px</span>
        </label>
        <input id="backgroundBlur" class="slider" type="range" min="0" max="20" step="1" value="0" />
    </div>
    <div class="row">
        <label>
            <span class="switch">
                <input id="pageZoomToggle" type="checkbox" />
                <span class="slider"></span>
            </span>
            Browser page zoom: <span id="zoomValue">100%</span>
        </label>
        <input id="pageZoom" class="slider" type="range" min="50" max="150" step="5" value="100" disabled />
    </div>
    <button id="openOptions">Open full settings</button>
    <div class="row subject-rules-section">
        <h2>Subject rules</h2>
        <div class="help" style="margin-top:0;">Add a keyword or subject code (e.g. 9ENGX2) to apply colours to all blocks of a subject..</div>
        <div id="subjectRuleList"></div>
        <button id="addRule" type="button" style="margin-top:8px;">Add rule</button>
        <button id="saveRules" type="button" style="margin-top:8px;">Save rules</button>
        <div id="rulesStatus" style="margin-top:6px;font-size:12px;color:#0d6f00;"></div>
    </div>
    <script src="menu.js"></script>
</body>
</html>
